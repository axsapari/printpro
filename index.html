<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- LOGIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 to-slate-900 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-3xl font-bold text-indigo-900 text-center mb-2">PrintManager Pro</h1>
            <p class="text-slate-500 text-center mb-6">Sistem Manajemen Percetakan</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Pilih Akun</label>
                    <select id="login-username" class="w-full px-4 py-3 border rounded-lg" required>
                        <option value="admin">AD - Admin</option>
                        <option value="agus">AG - Agus</option>
                        <option value="arko">AR - Arko</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full px-4 py-3 border rounded-lg" required>
                </div>
                <div id="login-error" class="text-red-600 text-sm hidden"></div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold">Masuk <i class="fas fa-arrow-right ml-2"></i></button>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="app-view" class="hidden-view min-h-screen flex">
        <aside class="w-64 bg-indigo-900 text-white fixed h-full">
            <div class="p-6 border-b border-indigo-800">
                <h2 class="text-xl font-bold">PrintManager Pro</h2>
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="switchView('dashboard')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="dashboard">📊 Dashboard</button>
                <button onclick="switchView('kuitansi')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="kuitansi">📦 Buat Kuitansi</button>
                <button onclick="switchView('modal')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="modal">💰 Catat Modal</button>
                <button onclick="switchView('pl')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="pl">📈 Untung & Rugi</button>
                <button onclick="switchView('riwayat')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="riwayat">📋 Riwayat</button>
                <button onclick="switchView('log')" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800" data-target="log">📝 Log</button>
            </nav>
            <div class="p-4 border-t border-indigo-800">
                <button onclick="logout()" class="w-full bg-red-600 py-2 rounded-lg">🚪 Logout</button>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <div id="view-dashboard" class="app-view-section">
                <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow">
                        <p class="text-sm text-slate-500">Pemasukan</p>
                        <p class="text-2xl font-bold text-green-600" id="dash-pemasukan">Rp 0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow">
                        <p class="text-sm text-slate-500">Pengeluaran</p>
                        <p class="text-2xl font-bold text-red-600" id="dash-pengeluaran">Rp 0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow">
                        <p class="text-sm text-slate-500">Saldo</p>
                        <p class="text-2xl font-bold text-indigo-600" id="dash-saldo">Rp 0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow">
                        <p class="text-sm text-slate-500">Order Bulan Ini</p>
                        <p class="text-2xl font-bold" id="dash-orders">0</p>
                    </div>
                </div>
            </div>

            <div id="view-kuitansi" class="app-view-section hidden-view">
                <h1 class="text-3xl font-bold mb-6">Buat Kuitansi</h1>
                <form id="kuitansi-form" class="bg-white p-6 rounded-xl shadow space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="k-nomor" placeholder="Nomor Kuitansi" class="border p-2 rounded" readonly>
                        <input type="date" id="k-tanggal" class="border p-2 rounded" required>
                    </div>
                    <input type="text" id="k-pelanggan" placeholder="Nama Pelanggan" class="w-full border p-2 rounded" required>
                    <textarea id="k-alamat" placeholder="Alamat" class="w-full border p-2 rounded"></textarea>
                    
                    <div id="items-container" class="space-y-2"></div>
                    <button type="button" onclick="addItemRow()" class="text-indigo-600">+ Tambah Item</button>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="k-diskon" placeholder="Diskon" value="0" class="border p-2 rounded">
                        <input type="number" id="k-dp" placeholder="DP" value="0" class="border p-2 rounded">
                    </div>
                    <div class="text-xl font-bold">Total: <span id="k-total">Rp 0</span></div>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded">💾 Simpan</button>
                </form>
            </div>

            <div id="view-modal" class="app-view-section hidden-view">
                <h1 class="text-3xl font-bold mb-6">Catat Modal</h1>
                <form id="modal-form" class="bg-white p-6 rounded-xl shadow space-y-4">
                    <select id="m-jenis" class="border p-2 rounded w-full">
                        <option value="modal_fisik">Modal Fisik</option>
                        <option value="modal_operasional">Modal Operasional</option>
                    </select>
                    <input type="date" id="m-tanggal" class="border p-2 rounded w-full" required>
                    <input type="text" id="m-nama" placeholder="Nama Pengeluaran" class="border p-2 rounded w-full" required>
                    <input type="number" id="m-jumlah" placeholder="Jumlah (Rp)" class="border p-2 rounded w-full" required>
                    <textarea id="m-keterangan" placeholder="Keterangan" class="border p-2 rounded w-full"></textarea>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded">+ Catat</button>
                </form>
                <div id="modal-list" class="mt-6 bg-white p-6 rounded-xl shadow"></div>
            </div>

            <div id="view-pl" class="app-view-section hidden-view">
                <h1 class="text-3xl font-bold mb-6">Untung & Rugi</h1>
                <div class="bg-white p-6 rounded-xl shadow space-y-4">
                    <div class="flex justify-between"><span>Pemasukan</span><span id="pl-pemasukan" class="font-bold text-green-600">Rp 0</span></div>
                    <div class="flex justify-between"><span>Pengeluaran</span><span id="pl-pengeluaran" class="font-bold text-red-600">Rp 0</span></div>
                    <div class="flex justify-between text-xl font-bold"><span>Laba/Rugi</span><span id="pl-laba">Rp 0</span></div>
                </div>
            </div>

            <div id="view-riwayat" class="app-view-section hidden-view">
                <h1 class="text-3xl font-bold mb-6">Riwayat</h1>
                <div id="riwayat-list" class="bg-white p-6 rounded-xl shadow"></div>
            </div>

            <div id="view-log" class="app-view-section hidden-view">
                <h1 class="text-3xl font-bold mb-6">Log Aktivitas</h1>
                <div id="log-list" class="bg-white p-6 rounded-xl shadow"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
